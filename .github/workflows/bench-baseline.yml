# M5 cheap baseline — manual dispatch or push to bench/baseline-m5-run.
# Never runs on pull_request. Key from secrets.OPENROUTER_API_KEY only.
#
# Arturo 22 Oct 9:51 Cancún:
# - Model: deepseek/deepseek-v4-flash ($0.091/$0.182 per MTok)
# - NEW budget: 100 requests (counter reset) + $0.49 usage-Δ candado
# - Proxy (microsdd 0755fde): count only POST messages; HEAD/health free;
#   rate-limit 20/min WAITS (no 429); budget → 403; MAX_RETRIES=0
# - BENCH_SONDA=1 → 1 baseline cell; full matrix only after sonda success
name: bench-baseline-m5

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sonda (1 baseline cell) or matrix (2×N=3)'
        required: true
        default: 'sonda'
        type: choice
        options:
          - sonda
          - matrix
  push:
    branches:
      - bench/baseline-m5-run

permissions:
  contents: read

concurrency:
  group: bench-baseline-m5
  cancel-in-progress: true

jobs:
  cheap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY secret is not available — aborting (no alternate key source)"
            exit 1
          fi
          echo "OPENROUTER_API_KEY is present (value not printed)"

      - name: Install Claude Code CLI (pinned 2.1.197)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.197
          claude --version || true
          echo "CLAUDE_CODE_VERSION=$(claude --version 2>/dev/null | head -1 || echo unknown)" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.claude"
          printf '%s\n' '{"hasTrustDialogAccepted":true,"hasCompletedProjectOnboarding":true}' > "$HOME/.claude/settings.json"

      - name: Resolve mode (sonda vs matrix)
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # push to bench/baseline-m5-run: read .bench-mode if present, else sonda
            if [ -f .bench-mode ]; then
              MODE=$(tr -d '[:space:]' < .bench-mode)
            else
              MODE=sonda
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE"

      - name: Run cheap baseline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          BENCH_MODEL_ID: deepseek/deepseek-v4-flash
          BENCH_SEED: "42"
          BENCH_TASK_IDS: fix-add-off-by-one
          # microsdd: maxTurns=3 → error_max_turns almost always; 6 fixes (15/16 nemotron).
          BENCH_MAX_TURNS: "6"
          BENCH_OUT_DIR: bench-out
          BENCH_PROJECT_ROOT: .
          BENCH_MAX_TOKENS: "2000000"
          BENCH_MAX_REQUESTS: "100"
          BENCH_MAX_REQUESTS_PER_MINUTE: "20"
          BENCH_MAX_SPEND_USD: "0.49"
          # Counter RESET for new deepseek baseline (Arturo 22 Oct 9:51).
          # Accumulated: sonda#1 (9) + matrix-maxTurns3 (→55). Seed absolute count.
          BENCH_REQUESTS_ALREADY_USED: "55"
          BENCH_SONDA: ${{ steps.mode.outputs.mode == 'sonda' && '1' || '0' }}
          BENCH_N: ${{ steps.mode.outputs.mode == 'sonda' && '1' || '3' }}
          CLAUDE_CODE_MAX_RETRIES: "0"
          ANTHROPIC_MAX_RETRIES: "0"
        run: bun run scripts/bench-baseline-cheap.ts

      - name: Post-candado usage snapshot (always)
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p bench-out
          bun -e '
            const key = process.env.OPENROUTER_API_KEY;
            if (!key) {
              console.log(JSON.stringify({ event: "post-lock", ok: false, reason: "no key" }));
              process.exit(0);
            }
            const res = await fetch("https://openrouter.ai/api/v1/key", {
              headers: { Authorization: "Bearer " + key, Accept: "application/json" },
            });
            if (!res.ok) {
              console.log(JSON.stringify({ event: "post-lock", ok: false, http: res.status }));
              process.exit(0);
            }
            const body = await res.json();
            const usage = body?.data?.usage ?? body?.usage ?? null;
            const limit = body?.data?.limit ?? body?.limit ?? null;
            const fs = await import("node:fs/promises");
            await fs.writeFile(
              "bench-out/usage-after.json",
              JSON.stringify({ schema: "bench-usage-after/v1", usage, limit, capturedAt: new Date().toISOString() }, null, 2),
            );
            console.log(JSON.stringify({ event: "post-lock", ok: true, usage, limit }));
          '

      - name: Upload sanitized aggregates (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-cheap
          path: |
            bench-out/bench-baseline-cheap.json
            bench-out/bench-report.md
            bench-out/bench-report.json
            bench-out/usage-after.json
          if-no-files-found: warn
