# M5 cheap baseline — manual dispatch only. Never runs on push or pull_request.
# Key from secrets.OPENROUTER_API_KEY only.
#
# - Proxy (microsdd 0755fde): count only POST messages; HEAD/health free;
#   rate-limit 20/min WAITS (no 429); budget → 403; MAX_RETRIES=0
# - Cumulative cap: 100 requests; `requests_already_used` seeds the proxy counter.
# - mode=sonda → 1 baseline cell; run matrix only after a sonda success.
# - Local (Claude Code + Opus/Sonnet/Haiku): `bun run bench:local` (docs/post-v1.8.0.md).
name: bench-baseline-m5

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sonda (1 baseline cell) or matrix (2×N)'
        required: true
        default: 'sonda'
        type: choice
        options:
          - sonda
          - matrix
      model:
        description: 'OpenRouter model id (`:free` ids accepted)'
        required: true
        default: 'deepseek/deepseek-v4-flash'
        type: string
      requests_already_used:
        description: 'Requests already spent of the cumulative 100 cap'
        required: true
        default: '60'
        type: string
      max_turns:
        description: 'Claude Code --max-turns per attempt'
        required: true
        default: '12'
        type: string
      n:
        description: 'Repetitions per task × variant (matrix only)'
        required: true
        default: '3'
        type: string
      task_ids:
        description: 'Comma-separated harness-v1 task ids'
        required: true
        default: 'fix-add-off-by-one'
        type: string
      max_spend_usd:
        description: 'OpenRouter usage-Δ cap (USD)'
        required: true
        default: '0.49'
        type: string

permissions:
  contents: read

concurrency:
  group: bench-baseline-m5
  # Never kill a run mid-spend.
  cancel-in-progress: false

jobs:
  cheap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY secret is not available — aborting (no alternate key source)"
            exit 1
          fi
          echo "OPENROUTER_API_KEY is present (value not printed)"

      - name: Install Claude Code CLI (pinned 2.1.197)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.197
          claude --version || true
          echo "CLAUDE_CODE_VERSION=$(claude --version 2>/dev/null | head -1 || echo unknown)" >> "$GITHUB_ENV"

      - name: Run cheap baseline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          BENCH_MODEL_ID: ${{ inputs.model }}
          BENCH_SEED: "42"
          BENCH_TASK_IDS: ${{ inputs.task_ids }}
          BENCH_MAX_TURNS: ${{ inputs.max_turns }}
          BENCH_OUT_DIR: bench-out
          BENCH_PROJECT_ROOT: .
          BENCH_MAX_TOKENS: "2000000"
          BENCH_MAX_REQUESTS: "100"
          BENCH_MAX_REQUESTS_PER_MINUTE: "20"
          BENCH_MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          BENCH_REQUESTS_ALREADY_USED: ${{ inputs.requests_already_used }}
          BENCH_SONDA: ${{ inputs.mode == 'sonda' && '1' || '0' }}
          BENCH_N: ${{ inputs.mode == 'sonda' && '1' || inputs.n }}
          CLAUDE_CODE_MAX_RETRIES: "0"
          ANTHROPIC_MAX_RETRIES: "0"
        run: bun run scripts/bench-baseline-cheap.ts

      - name: Post-candado usage snapshot (always)
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p bench-out
          bun -e '
            const key = process.env.OPENROUTER_API_KEY;
            if (!key) {
              console.log(JSON.stringify({ event: "post-lock", ok: false, reason: "no key" }));
              process.exit(0);
            }
            const res = await fetch("https://openrouter.ai/api/v1/key", {
              headers: { Authorization: "Bearer " + key, Accept: "application/json" },
            });
            if (!res.ok) {
              console.log(JSON.stringify({ event: "post-lock", ok: false, http: res.status }));
              process.exit(0);
            }
            const body = await res.json();
            const usage = body?.data?.usage ?? body?.usage ?? null;
            const limit = body?.data?.limit ?? body?.limit ?? null;
            const fs = await import("node:fs/promises");
            await fs.writeFile(
              "bench-out/usage-after.json",
              JSON.stringify({ schema: "bench-usage-after/v1", usage, limit, capturedAt: new Date().toISOString() }, null, 2),
            );
            console.log(JSON.stringify({ event: "post-lock", ok: true, usage, limit }));
          '

      - name: Upload sanitized aggregates (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline-cheap
          path: |
            bench-out/bench-baseline-cheap.json
            bench-out/bench-report.md
            bench-out/bench-report.json
            bench-out/usage-after.json
          if-no-files-found: warn
