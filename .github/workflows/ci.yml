name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test test/hook-portability.test.ts test/git-guardrail-hook.test.ts test/invoke-hook-failopen.test.ts test/agy-preset.test.ts test/presets/frontmatter-parity.test.ts
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: M4 prompt-diff --compiled needs v1.7.1 / v1.7.2
      # (default shallow checkout has neither, so git worktree add fails).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:prompt-changelog
      - run: bun run check:drift
      - run: bun run check:council-redirect
      - run: bun test --coverage
      - run: bun run check:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - run: bun run build
      - run: bun run src/cli/main.ts doctor
      - run: bun run src/cli/main.ts ingest
      - run: bun run src/cli/main.ts product graph

  # Deterministic harness metrics only — never calls models. Informative (non-blocking).
  prompt-metrics:
    name: prompt-metrics (informative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Prompt metrics (harness-v1 compile)
        run: bun run src/cli/main.ts scorecard prompt-metrics --output json
      - name: Compiled prompt-diff against main
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || 'main' }}"
          bun run src/cli/main.ts scorecard prompt-diff "origin/${BASE_REF}" HEAD --compiled --output json
      - name: Schema + telemetry fixture replay (no live models)
        run: bun test test/telemetry/
