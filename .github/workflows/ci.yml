name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  hook-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test test/hook-portability.test.ts test/git-guardrail-hook.test.ts test/invoke-hook-failopen.test.ts test/agy-preset.test.ts test/presets/frontmatter-parity.test.ts
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:prompt-changelog
      - run: bun run check:drift
      - run: bun run check:council-redirect
      - run: bun test --coverage
      - run: bun run check:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - run: bun run build
      - run: bun run src/cli/main.ts doctor
      - run: bun run src/cli/main.ts ingest
      - run: bun run src/cli/main.ts product graph
