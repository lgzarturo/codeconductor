id: harness-v1
version: 1
fixtureDir: fixture
tasks:
  - id: fix-add-off-by-one
    title: Fix add off-by-one
    type: fix
    risk: low
    prompt: add(a, b) returns a + b + 1. It must return a + b.
    scope: src/math.ts, src/math.test.ts
    acceptanceCriteria:
      - add(2, 3) returns 5
      - Promote src/math.test.ts.example to src/math.test.ts and make it pass
    testCommand: bun test src/math.test.ts
  - id: feature-multiply
    title: Add multiply helper
    type: feature
    risk: low
    prompt: >
      Add multiply(a, b) that returns the product of two numbers. Export it from src/math.ts.
      Do not change add(). Promote src/multiply.test.ts.example to src/multiply.test.ts.
    scope: src/math.ts, src/multiply.test.ts
    acceptanceCriteria:
      - multiply is exported from src/math.ts
      - multiply(3, 4) returns 12
      - src/multiply.test.ts passes (add may remain broken)
    testCommand: bun test src/multiply.test.ts
  - id: refactor-greet
    title: Extract greet name formatting
    type: refactor
    risk: low
    prompt: Extract name formatting from greet() into formatName() without changing greet output.
    scope: src/greet.ts, src/greet.test.ts
    acceptanceCriteria:
      - formatName is exported
      - greet still returns Hello, <name>!
      - Promote src/greet.test.ts.example to src/greet.test.ts and keep it passing
    testCommand: bun test src/greet.test.ts
  - id: review-seeded-bug
    title: Review clamp off-by-one
    type: review
    risk: medium
    prompt: >
      Review src/review-target.ts. There is a seeded defect in clamp(): when n equals max
      it returns max-1. Write a short report to src/review-report.md that identifies the defect
      (upper bound / off-by-one). Do NOT modify src/review-target.ts or apply a code patch.
    scope: src/review-report.md
    acceptanceCriteria:
      - src/review-report.md identifies the clamp upper-bound off-by-one
      - src/review-target.ts is unchanged (clamp still buggy)
    testCommand: bun test src/review-report.test.ts
  - id: out-of-scope-guard
    title: Do not touch out-of-scope sentinel
    type: refactor
    risk: low
    prompt: >
      Fix add() in src/math.ts only. Do not modify src/scope-keep.ts (SCOPE_SENTINEL must stay).
    scope: src/math.ts, src/math.test.ts
    acceptanceCriteria:
      - add(2, 3) returns 5
      - src/scope-keep.ts unchanged (SCOPE_SENTINEL === do-not-modify)
    testCommand: bun test src/math.test.ts
