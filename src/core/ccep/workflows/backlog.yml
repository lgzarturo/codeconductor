id: backlog
version: 1
command: backlog
taskCard:
  type: feature
  requiredFields:
    - title
    - type
    - risk
    - scope
    - context
    - acceptanceCriteria
phases:
  - id: wayfinding
    agent: repo-explorer
    outputSchema: agent-output
  - id: intake
    agent: task-coach
    outputSchema: planner-output
    stopGate: confirmation
  - id: write-backlog
    agent: docs
  - id: validate-backlog
    agent: orchestrator
    type: cli-gate
  - id: plan-changes
    agent: orchestrator
    type: cli-gate
routing:
  default:
    - wayfinding
    - intake
    - write-backlog
    - validate-backlog
    - plan-changes
confirmationGate:
  stopOnHighRisk: true
  stopOnQuestions: true
