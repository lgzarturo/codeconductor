id: db-migration
version: 1
command: db-migration
taskCard:
  type: feature
  requiredFields:
    - scope
    - risk
    - acceptanceCriteria
phases:
  - id: design
    agent: architect
    outputSchema: technical-plan
  - id: test
    agent: tester
  - id: implement
    agent: implementer
    dependsOn:
      - test
  - id: review
    agent: reviewer
routing:
  default:
    - design
    - test
    - implement
    - review
confirmationGate:
  stopOnHighRisk: true
  stopOnQuestions: true
