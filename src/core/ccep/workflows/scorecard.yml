id: scorecard
version: 1
command: scorecard
intakeSchema: scorecard-task-id
phases:
  - id: create
    agent: orchestrator
    type: cli-gate
  - id: evaluate
    agent: reviewer
    outputSchema: scorecard-record
routing:
  default:
    - create
    - evaluate
confirmationGate:
  stopOnHighRisk: false
  stopOnQuestions: false
