id: security
version: 1
command: security
taskCard:
  type: fix
  requiredFields:
    - domain
    - authorization
    - risk
    - scope
phases:
  - id: wayfinding
    agent: repo-explorer
    outputSchema: agent-output
  - id: intake
    agent: task-coach
    outputSchema: planner-output
    stopGate: confirmation
  - id: test
    agent: tester
  - id: implement
    agent: implementer
    dependsOn:
      - test
  - id: review
    agent: reviewer
routing:
  default:
    - wayfinding
    - intake
    - test
    - implement
  riskRules:
    - when:
        risk: low
      then:
        - wayfinding
        - test
        - implement
    - when:
        risk:
          - medium
          - high
      then:
        - wayfinding
        - test
        - implement
        - review
confirmationGate:
  stopOnHighRisk: true
  stopOnQuestions: true
