target: codex
entries:
  - src: codex/config.toml
    dest: .codex/config.toml
    strategy: create-only
  - src: codex/AGENTS.md
    dest: .codex/AGENTS.md
    strategy: merge-managed
    template: true
  - src: codex/skills
    dest: .codex/skills
    strategy: overwrite
  - src: opencode/prompts/v1.0.0
    dest: .codex/prompts/v1.0.0
    strategy: overwrite
    template: true
