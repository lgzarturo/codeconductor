target: gemini
entries:
  - src: gemini/GEMINI.md
    dest: GEMINI.md
    strategy: merge-managed
    globalStrategy: merge-managed
    template: true
  - src: gemini/settings.json
    dest: .gemini/settings.json
    strategy: overwrite
    globalStrategy: merge-json
  - src: opencode/agents
    dest: .gemini/agents
    strategy: overwrite
    template: true
  - src: opencode/prompts/v1.0.0
    dest: .gemini/prompts/v1.0.0
    strategy: overwrite
    template: true
  - src: gemini/commands
    dest: .gemini/commands
    strategy: overwrite
  - src: opencode/skills
    dest: .gemini/skills
    strategy: overwrite
