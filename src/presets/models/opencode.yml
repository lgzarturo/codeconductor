# Model configuration for OpenCode preset
# Agent models live in roles.yml; loadModelConfig() merges this file with it.
# OpenCode uses permission blocks instead of tool-name substitution, so this
# is the one target that overrides roles.yml's `tools:` table.
target: opencode
permissions:
  Read: read
  Write: edit
  Edit: edit
  Bash: bash
  Glob: glob
  Grep: grep
  WebFetch: webfetch
