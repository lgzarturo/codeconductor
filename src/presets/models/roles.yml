tools:
  Read:
    claude: ViewCodeItem / ReadFile
    codex: read_file
    gemini: view_file
    cursor: read
    opencode: file_read / view_file
    agy: view_file
  Write:
    claude: WriteNewFile
    codex: write_file
    gemini: write_file
    cursor: write
    opencode: file_write
    agy: write_to_file
  Edit:
    claude: StrReplaceEditor
    codex: apply_diff
    gemini: patch_file
    cursor: edit
    opencode: file_patch / edit
    agy: replace_file_content / multi_replace_file_content
  Bash:
    claude: Bash
    codex: bash
    gemini: execute_command
    cursor: shell
    opencode: bash / run_command
    agy: run_command
  Glob:
    claude: Glob
    codex: glob
    gemini: list_dir
    cursor: find
    opencode: dir_list / glob
    agy: list_dir
  Grep:
    claude: Grep
    codex: grep
    gemini: search_grep
    cursor: grep
    opencode: grep_search / search
    agy: grep_search
  WebFetch:
    claude: WebFetch
    codex: fetch / browse
    gemini: fetch_url
    cursor: fetch
    opencode: web_fetch / browser
    agy: read_url_content / read_browser_page
