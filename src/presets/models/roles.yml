# Shared model + tool-name tables for every CodeConductor target.
# Single source of truth for the 14 agent roles x 8 providers (claude,
# opencode, codex, gemini, cursor, grok, agy, pi) and the 7 canonical tool
# names x 6 target-native tool-name mappings (claude, opencode, codex,
# gemini, cursor, agy — pi has no tools: frontmatter to substitute into, see
# src/adapters/pi/pi-council-generator.ts). Loaded by loadModelConfig() in
# manifest-loader.ts and merged with the requesting target's own
# src/presets/models/<target>.yml, which carries only `target:` plus
# (opencode only) a `permissions:` override — opencode uses permission
# blocks instead of tool-name substitution.
#
# `pi:` values are copied verbatim from `claude:` — Pi is provider-agnostic
# and Anthropic model IDs are stable across clients (verified against
# https://github.com/earendil-works/pi docs, not against a live install; see
# docs/harness-spec.md and the Fase 3 risk note).

