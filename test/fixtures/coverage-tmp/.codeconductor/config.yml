version: 0.2.0
project:
  name: overwritten-name
  profile: node
defaults:
  target: opencode
  overwrite: false
  locale: en
presets:
  council:
    enabled: true
    version: 0.1.0
safety:
  destructiveCommands:
    - rm -rf
    - drop table
    - delete from
  secretPatterns:
    - password
    - secret
    - api_key
    - token
    - api[_-]?key
    - access[_-]?token
    - auth[_-]?token
    - private[_-]?key
  compileCheck:
    enabled: true
    command: tsc --noEmit
    timeoutMs: 120000
loop:
  enabled: true
  maxIterations: 3
  maxTokenBudget: 0
